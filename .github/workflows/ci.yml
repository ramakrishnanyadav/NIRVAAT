name: NIRVAAT Safety & Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d792dbd422115e34837 # v4.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis & TypeScript Typecheck
        run: pnpm run lint

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e04a79a1f33f6d713c4a6b2c24430e3bb4ee5f42 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Test Pyramid (Physics, Verifier, Regressions, Red-Flag, API, A11y Axe, Security)
        run: pnpm test

      - name: Glass Contrast & Color Ratio Audit
        run: pnpm run test:contrast

      - name: Measure Test Coverage
        run: pnpm run test:coverage

      - name: Production Client & Server Build
        run: pnpm run build
