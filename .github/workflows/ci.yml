name: NIRVAAT Safety & Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis & TypeScript Typecheck
        run: pnpm run lint

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Test Pyramid (Physics, Verifier, Regressions, Red-Flag, API, A11y Axe, Security)
        run: pnpm test

      - name: Glass Contrast & Color Ratio Audit
        run: pnpm run test:contrast

      - name: Measure Test Coverage
        run: pnpm run test:coverage

      - name: Production Client & Server Build
        run: pnpm run build
